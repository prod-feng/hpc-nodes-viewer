<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Infrastructure Node Viewer</title>


<style>

/* ============================================================
   GLOBAL
   ============================================================ */

:root {

    --bg: #f3f5f8;

    --card: #ffffff;

    --text: #1f2937;

    --muted: #6b7280;

    --border: #dfe4ea;

    --primary: #2563eb;

    --primary-dark: #1d4ed8;

    --tab-bg: #e8edf4;

    --hover: #f8fafc;

    --green: #16a34a;

    --green-bg: #dcfce7;

    --yellow: #ca8a04;

    --yellow-bg: #fef9c3;

    --red: #dc2626;

    --red-bg: #fee2e2;

    --gray: #64748b;

    --gray-bg: #f1f5f9;

    --shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);
}


* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

}


body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background: var(--bg);

    color: var(--text);
}


button,
input {

    font-family: inherit;

}


button {

    cursor: pointer;

}


/* ============================================================
   APPLICATION
   ============================================================ */

.app {

    max-width: 1900px;

    margin: 0 auto;

    padding: 24px;

}


/* ============================================================
   HEADER
   ============================================================ */

.header {

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 12px;

    padding: 20px 24px;

    box-shadow: var(--shadow);

    margin-bottom: 18px;

}


.header-top {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

}


.title {

    margin: 0;

    font-size: 26px;

    font-weight: 650;

}


.subtitle {

    margin-top: 5px;

    color: var(--muted);

    font-size: 14px;

}


.file-controls {

    display: flex;

    align-items: center;

    gap: 12px;

}


.file-name {

    color: var(--muted);

    font-size: 13px;

    white-space: nowrap;

    max-width: 300px;

    overflow: hidden;

    text-overflow: ellipsis;

}


.primary-button {

    display: inline-block;

    background: var(--primary);

    color: white;

    border-radius: 7px;

    padding: 9px 15px;

    font-size: 14px;

    cursor: pointer;

    user-select: none;

}


.primary-button:hover {

    background: var(--primary-dark);

}


input[type="file"] {

    display: none;

}


/* ============================================================
   STATUS MESSAGE
   ============================================================ */

.status {

    margin-top: 14px;

    padding: 9px 12px;

    border-radius: 6px;

    background: #f8fafc;

    color: var(--muted);

    font-size: 13px;

}


.status.success {

    background: #f0fdf4;

    color: #166534;

}


.status.error {

    background: #fef2f2;

    color: #991b1b;

}


/* ============================================================
   TABS
   ============================================================ */

.tabs-container {

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 12px;

    box-shadow: var(--shadow);

    padding: 12px;

    margin-bottom: 18px;

}


.tabs {

    display: flex;

    flex-wrap: wrap;

    gap: 7px;

}


.tab {

    background: var(--tab-bg);

    color: #475569;

    border: 1px solid transparent;

    border-radius: 7px;

    padding: 9px 14px;

    font-size: 14px;

}


.tab:hover {

    background: #dce4ee;

}


.tab.active {

    background: var(--primary);

    color: white;

}


.tab-count {

    margin-left: 5px;

    opacity: 0.75;

}


/* ============================================================
   MAIN CONTENT
   ============================================================ */

.content {

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 12px;

    box-shadow: var(--shadow);

    overflow: hidden;

}


/* ============================================================
   TOOLBAR
   ============================================================ */

.toolbar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    padding: 15px 18px;

    border-bottom: 1px solid var(--border);

}


.search-container {

    flex: 1;

    max-width: 900px;

}


.search {

    width: 100%;

    border: 1px solid var(--border);

    border-radius: 7px;

    padding: 10px 13px;

    font-size: 14px;

    outline: none;

}


.search:focus {

    border-color: var(--primary);

    box-shadow:
        0 0 0 2px
        rgba(37, 99, 235, 0.1);

}


.result-count {

    color: var(--muted);

    font-size: 13px;

    white-space: nowrap;

}


/* ============================================================
   DROP ZONE
   ============================================================ */

.drop-zone {

    border: 2px dashed #cbd5e1;

    border-radius: 9px;

    margin: 15px 18px;

    padding: 20px;

    text-align: center;

    color: var(--muted);

    transition: all 0.15s ease;

}


.drop-zone.drag-over {

    border-color: var(--primary);

    background: #eff6ff;

    color: var(--primary);

}


/* ============================================================
   TABLE
   ============================================================ */

.table-wrapper {

    width: 100%;

    overflow-x: auto;

}


table {

    width: 100%;

    min-width: 1450px;

    border-collapse: collapse;

}


th {

    background: #f8fafc;

    color: #475569;

    font-size: 12px;

    font-weight: 650;

    text-align: left;

    padding: 11px 14px;

    border-bottom: 1px solid var(--border);

    cursor: pointer;

    white-space: nowrap;

    user-select: none;

}


th:hover {

    background: #eef2f7;

}


td {

    padding: 12px 14px;

    border-bottom: 1px solid #edf0f3;

    font-size: 14px;

    vertical-align: middle;

}


tbody tr {

    cursor: pointer;

    transition: background 0.1s ease;

}


tbody tr:hover {

    background: var(--hover);

}


/* ============================================================
   NAME
   ============================================================ */

.node-name {

    font-weight: 600;

    color: #1e40af;

    white-space: nowrap;

}


/* ============================================================
   IP ADDRESS
   ============================================================ */

.ip-address {

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;

    font-size: 13px;

    white-space: nowrap;

}


.ip-link {

    color: #2563eb;

    text-decoration: none;

}


.ip-link:hover {

    color: #1d4ed8;

    text-decoration: underline;

}


.no-ip {

    color: #94a3b8;

}


/* ============================================================
   TYPE
   ============================================================ */

.type-badge {

    display: inline-block;

    padding: 4px 9px;

    border-radius: 999px;

    background: #e8eefc;

    color: #1d4ed8;

    font-size: 12px;

    font-weight: 600;

    white-space: nowrap;

}


/* ============================================================
   STATUS
   ============================================================ */

.status-badge {

    display: inline-flex;

    align-items: center;

    gap: 6px;

    padding: 4px 9px;

    border-radius: 999px;

    font-size: 12px;

    font-weight: 600;

    white-space: nowrap;

}


.status-dot {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    display: inline-block;

}


.status-online {

    color: #166534;

    background: var(--green-bg);

}


.status-online .status-dot {

    background: var(--green);

}


.status-warning {

    color: #854d0e;

    background: var(--yellow-bg);

}


.status-warning .status-dot {

    background: var(--yellow);

}


.status-offline {

    color: #991b1b;

    background: var(--red-bg);

}


.status-offline .status-dot {

    background: var(--red);

}


.status-unknown {

    color: #475569;

    background: var(--gray-bg);

}


.status-unknown .status-dot {

    background: var(--gray);

}


/* ============================================================
   SERIAL
   ============================================================ */

.serial {

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;

    font-size: 13px;

    white-space: nowrap;

}


/* ============================================================
   EMPTY STATE
   ============================================================ */

.empty {

    padding: 60px 20px;

    text-align: center;

    color: var(--muted);

}


.empty-title {

    font-size: 18px;

    color: var(--text);

    margin-bottom: 7px;

}


.empty-text {

    font-size: 14px;

}


/* ============================================================
   MODAL
   ============================================================ */

.modal-overlay {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(15, 23, 42, 0.45);

    z-index: 1000;

    align-items: center;

    justify-content: center;

    padding: 20px;

}


.modal-overlay.show {

    display: flex;

}


.modal {

    width: min(850px, 100%);

    max-height: 85vh;

    overflow-y: auto;

    background: white;

    border-radius: 12px;

    box-shadow:
        0 15px 45px
        rgba(0, 0, 0, 0.2);

}


.modal-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 18px 20px;

    border-bottom: 1px solid var(--border);

}


.modal-title {

    margin: 0;

    font-size: 20px;

}


.close-button {

    background: transparent;

    color: var(--muted);

    border: none;

    font-size: 22px;

    padding: 3px 8px;

}


.close-button:hover {

    background: #f1f5f9;

}


.modal-body {

    padding: 20px;

}


.detail-grid {

    display: grid;

    grid-template-columns: 170px 1fr;

    border: 1px solid var(--border);

    border-radius: 8px;

    overflow: hidden;

}


.detail-label,
.detail-value {

    padding: 11px 13px;

    border-bottom: 1px solid var(--border);

}


.detail-label {

    background: #f8fafc;

    font-weight: 600;

    color: #475569;

}


.detail-value {

    overflow-wrap: anywhere;

}


/* ============================================================
   RESPONSIVE
   ============================================================ */

@media (max-width: 900px) {

    .app {

        padding: 12px;

    }


    .header-top {

        flex-direction: column;

        align-items: flex-start;

    }


    .file-controls {

        width: 100%;

        justify-content: space-between;

    }


    .toolbar {

        flex-direction: column;

        align-items: stretch;

    }


    .search-container {

        max-width: none;

    }


    .detail-grid {

        grid-template-columns: 1fr;

    }


    .detail-label {

        border-bottom: none;

        padding-bottom: 4px;

    }


    .detail-value {

        padding-top: 4px;

    }

}

</style>

</head>


<body>


<div class="app">


    <!-- ========================================================
         HEADER
         ======================================================== -->

    <div class="header">

        <div class="header-top">

            <div>

                <h1 class="title">
                    Infrastructure Node Viewer
                </h1>

                <div class="subtitle">
                    Offline infrastructure node inventory
                </div>

            </div>


            <div class="file-controls">

                <span
                    class="file-name"
                    id="fileName"
                >
                    Loading nodes.csv...
                </span>


                <label class="primary-button">

                    Choose CSV

                    <input
                        type="file"
                        id="fileInput"
                        accept=".csv,text/csv"
                    >

                </label>

            </div>

        </div>


        <div
            id="status"
            class="status"
        >
            Loading default CSV...
        </div>

    </div>


    <!-- ========================================================
         TABS
         ======================================================== -->

    <div class="tabs-container">

        <div
            class="tabs"
            id="tabs"
        ></div>

    </div>


    <!-- ========================================================
         CONTENT
         ======================================================== -->

    <div class="content">


        <div class="toolbar">

            <div class="search-container">

                <input
                    type="search"
                    id="searchInput"
                    class="search"
                    placeholder="Search name, IP, type, rack, location, status, description, serial..."
                    autocomplete="off"
                >

            </div>


            <div
                id="resultCount"
                class="result-count"
            >
                0 nodes
            </div>

        </div>


        <!-- ====================================================
             DROP ZONE
             ==================================================== -->

        <div
            id="dropZone"
            class="drop-zone"
        >

            <strong>
                Drop a CSV file here
            </strong>

            <br>

            or click
            <strong>Choose CSV</strong>
            above

        </div>


        <!-- ====================================================
             TABLE
             ==================================================== -->

        <div
            id="tableContainer"
            class="table-wrapper"
        >

            <div class="empty">

                <div class="empty-title">
                    No node data loaded
                </div>

                <div class="empty-text">

                    Put
                    <strong>nodes.csv</strong>
                    beside this HTML file,
                    or choose a CSV file.

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ============================================================
     NODE DETAILS MODAL
     ============================================================ -->

<div
    id="modalOverlay"
    class="modal-overlay"
>

    <div class="modal">


        <div class="modal-header">

            <h2
                id="modalTitle"
                class="modal-title"
            >
                Node Details
            </h2>


            <button
                id="closeModal"
                class="close-button"
                title="Close"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <div
                id="detailGrid"
                class="detail-grid"
            ></div>

        </div>

    </div>

</div>


<script>

/* ============================================================
   APPLICATION STATE
   ============================================================ */

let nodes = [];

let currentTab = "all";

let searchText = "";

let sortColumn = null;

let sortDirection = "asc";


/* ============================================================
   REQUIRED CSV COLUMNS
   ============================================================ */

const REQUIRED_COLUMNS = [

    "name",

    "internal-ip",

    "ipmi-ip",

    "mgmt-ip",

    "type",

    "rack",

    "location",

    "status",

    "description",

    "serial"

];


/* ============================================================
   DOM REFERENCES
   ============================================================ */

const fileInput =
    document.getElementById(
        "fileInput"
    );


const fileName =
    document.getElementById(
        "fileName"
    );


const statusElement =
    document.getElementById(
        "status"
    );


const tabs =
    document.getElementById(
        "tabs"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const resultCount =
    document.getElementById(
        "resultCount"
    );


const tableContainer =
    document.getElementById(
        "tableContainer"
    );


const dropZone =
    document.getElementById(
        "dropZone"
    );


const modalOverlay =
    document.getElementById(
        "modalOverlay"
    );


const closeModal =
    document.getElementById(
        "closeModal"
    );


const modalTitle =
    document.getElementById(
        "modalTitle"
    );


const detailGrid =
    document.getElementById(
        "detailGrid"
    );


/* ============================================================
   STARTUP
   ============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadDefaultCSV();

    }
);


/* ============================================================
   DEFAULT CSV
   ============================================================ */

async function loadDefaultCSV() {

    try {

        const response =
            await fetch(
                "nodes.csv",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "nodes.csv could not be loaded"
            );

        }


        const text =
            await response.text();


        processCSV(
            text,
            "nodes.csv"
        );


    } catch (error) {

        console.warn(
            error
        );


        fileName.textContent =
            "No default CSV loaded";


        setStatus(
            "nodes.csv was not found. Choose a CSV file to continue.",
            "error"
        );

    }

}


/* ============================================================
   FILE SELECTION
   ============================================================ */

fileInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];


        if (!file) {

            return;

        }


        readCSVFile(file);

    }
);


function readCSVFile(file) {

    if (
        !file.name
            .toLowerCase()
            .endsWith(".csv")
    ) {

        setStatus(
            "Please select a CSV file.",
            "error"
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        event => {

            processCSV(
                event.target.result,
                file.name
            );

        };


    reader.onerror =
        () => {

            setStatus(
                "Unable to read the selected file.",
                "error"
            );

        };


    reader.readAsText(file);

}


/* ============================================================
   DRAG & DROP
   ============================================================ */

dropZone.addEventListener(
    "dragenter",
    event => {

        event.preventDefault();

        dropZone.classList.add(
            "drag-over"
        );

    }
);


dropZone.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

        dropZone.classList.add(
            "drag-over"
        );

    }
);


dropZone.addEventListener(
    "dragleave",
    event => {

        event.preventDefault();

        dropZone.classList.remove(
            "drag-over"
        );

    }
);


dropZone.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        dropZone.classList.remove(
            "drag-over"
        );


        const file =
            event.dataTransfer.files[0];


        if (file) {

            readCSVFile(file);

        }

    }
);


/* ============================================================
   CSV PROCESSING
   ============================================================ */

function processCSV(
    text,
    sourceName
) {

    try {

        const rows =
            parseCSV(text);


        if (!rows.length) {

            throw new Error(
                "CSV contains no rows."
            );

        }


        const headers =
            rows[0].map(
                header =>
                    normalizeHeader(
                        header
                    )
            );


        /*
         * Verify the important columns.
         */

        const missingColumns =
            REQUIRED_COLUMNS.filter(
                required =>
                    !headers.includes(
                        required
                    )
            );


        /*
         * We don't stop loading when
         * optional data is missing.
         *
         * However, we warn the user.
         */

        if (
            missingColumns.length
        ) {

            console.warn(
                "Missing columns:",
                missingColumns
            );

        }


        nodes = [];


        for (
            let rowIndex = 1;
            rowIndex < rows.length;
            rowIndex++
        ) {

            const row =
                rows[rowIndex];


            /*
             * Ignore completely empty rows.
             */

            if (
                row.every(
                    value =>
                        String(value)
                            .trim() === ""
                )
            ) {

                continue;

            }


            const node = {};


            headers.forEach(
                (
                    header,
                    columnIndex
                ) => {

                    node[header] =
                        row[columnIndex] !== undefined
                            ? String(
                                row[columnIndex]
                            ).trim()
                            : "";

                }
            );


            nodes.push(node);

        }


        currentTab = "all";

        searchText = "";

        searchInput.value = "";

        sortColumn = null;

        sortDirection = "asc";


        fileName.textContent =
            sourceName;


        setStatus(
            `Loaded ${nodes.length} node${nodes.length === 1 ? "" : "s"} from ${sourceName}.`,
            "success"
        );


        buildTabs();

        renderTable();


    } catch (error) {

        console.error(
            error
        );


        setStatus(
            "Unable to parse CSV: " +
            error.message,
            "error"
        );

    }

}


/* ============================================================
   CSV PARSER
   ============================================================ */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];


        const next =
            text[i + 1];


        /*
         * Quoted field
         */

        if (char === '"') {

            if (
                insideQuotes &&
                next === '"'
            ) {

                value += '"';

                i++;

            } else {

                insideQuotes =
                    !insideQuotes;

            }

        }


        /*
         * Column separator
         */

        else if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);

            value = "";

        }


        /*
         * End of row
         */

        else if (
            (
                char === "\n" ||
                char === "\r"
            ) &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }


            row.push(value);

            value = "";

            rows.push(row);

            row = [];

        }


        else {

            value += char;

        }

    }


    /*
     * Last row
     */

    if (
        value.length > 0 ||
        row.length > 0
    ) {

        row.push(value);

        rows.push(row);

    }


    return rows;

}


/* ============================================================
   HEADER NORMALIZATION
   ============================================================ */

function normalizeHeader(
    header
) {

    return String(header || "")
        .trim()
        .toLowerCase()
        .replace(
            /^\uFEFF/,
            ""
        )
        .replace(
            /[_\s]+/g,
            "-"
        );

}


/* ============================================================
   FIELD ACCESS
   ============================================================ */

function getColumn(
    node,
    column
) {

    const normalized =
        normalizeHeader(
            column
        );


    return (
        node[normalized] !== undefined
            ? node[normalized]
            : ""
    );

}


/* ============================================================
   BUILD TABS
   ============================================================ */

function buildTabs() {

    tabs.innerHTML = "";


    /*
     * ALL tab
     */

    tabs.appendChild(
        createTab(
            "all",
            "All",
            nodes.length
        )
    );


    /*
     * Get node types
     */

    const typeMap =
        new Map();


    nodes.forEach(
        node => {

            const type =
                (
                    getColumn(
                        node,
                        "type"
                    ) ||
                    "Other"
                ).trim();


            const key =
                type.toLowerCase();


            if (
                !typeMap.has(key)
            ) {

                typeMap.set(
                    key,
                    {
                        label: type,
                        count: 0
                    }
                );

            }


            typeMap.get(
                key
            ).count++;

        }
    );


    /*
     * Sort types alphabetically.
     */

    const types =
        Array.from(
            typeMap.values()
        ).sort(
            (a, b) =>
                a.label.localeCompare(
                    b.label
                )
        );


    types.forEach(
        item => {

            tabs.appendChild(
                createTab(
                    item.label.toLowerCase(),
                    item.label,
                    item.count
                )
            );

        }
    );


    updateActiveTab();

}


/* ============================================================
   CREATE TAB
   ============================================================ */

function createTab(
    key,
    label,
    count
) {

    const button =
        document.createElement(
            "button"
        );


    button.className =
        "tab";


    button.dataset.tab =
        key;


    button.innerHTML =
        `${escapeHTML(label)}
        <span class="tab-count">
            (${count})
        </span>`;


    button.addEventListener(
        "click",
        () => {

            currentTab =
                key;


            updateActiveTab();

            renderTable();

        }
    );


    return button;

}


/* ============================================================
   ACTIVE TAB
   ============================================================ */

function updateActiveTab() {

    document
        .querySelectorAll(
            ".tab"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.tab ===
                    currentTab
                );

            }
        );

}


/* ============================================================
   SEARCH
   ============================================================ */

searchInput.addEventListener(
    "input",
    event => {

        searchText =
            event.target.value
                .trim()
                .toLowerCase();


        renderTable();

    }
);


/* ============================================================
   FILTER NODES
   ============================================================ */

function getFilteredNodes() {

    let result =
        nodes.filter(
            node => {

                const type =
                    (
                        getColumn(
                            node,
                            "type"
                        ) ||
                        "Other"
                    )
                    .trim()
                    .toLowerCase();


                /*
                 * Tab filter
                 */

                if (
                    currentTab !== "all" &&
                    type !== currentTab
                ) {

                    return false;

                }


                /*
                 * Search filter
                 */

                if (!searchText) {

                    return true;

                }


                return Object
                    .values(node)
                    .some(
                        value =>
                            String(value)
                                .toLowerCase()
                                .includes(
                                    searchText
                                )
                    );

            }
        );


    /*
     * Sorting
     */

    if (sortColumn) {

        result.sort(
            (a, b) => {

                const av =
                    String(
                        a[sortColumn] || ""
                    ).toLowerCase();


                const bv =
                    String(
                        b[sortColumn] || ""
                    ).toLowerCase();


                const comparison =
                    av.localeCompare(
                        bv,
                        undefined,
                        {
                            numeric: true,
                            sensitivity: "base"
                        }
                    );


                return sortDirection === "asc"
                    ? comparison
                    : -comparison;

            }
        );

    }


    return result;

}


/* ============================================================
   RENDER TABLE
   ============================================================ */

function renderTable() {

    if (!nodes.length) {

        resultCount.textContent =
            "0 nodes";


        tableContainer.innerHTML = `

            <div class="empty">

                <div class="empty-title">
                    No node data loaded
                </div>

                <div class="empty-text">
                    Choose a CSV file above.
                </div>

            </div>

        `;


        return;

    }


    const filtered =
        getFilteredNodes();


    resultCount.textContent =
        `${filtered.length} node${filtered.length === 1 ? "" : "s"}`;


    if (!filtered.length) {

        tableContainer.innerHTML = `

            <div class="empty">

                <div class="empty-title">
                    No matching nodes
                </div>

                <div class="empty-text">
                    Try changing your search or selecting another tab.
                </div>

            </div>

        `;


        return;

    }


    /*
     * IMPORTANT:
     *
     * The three IP fields are always separate
     * columns in every row.
     */

    const columns = [

        {
            key: "name",
            label: "Name"
        },

        {
            key: "internal-ip",
            label: "Internal IP"
        },

        {
            key: "ipmi-ip",
            label: "IPMI IP"
        },

        {
            key: "mgmt-ip",
            label: "Mgmt IP"
        },

        {
            key: "type",
            label: "Type"
        },

        {
            key: "rack",
            label: "Rack"
        },

        {
            key: "location",
            label: "Location"
        },

        {
            key: "status",
            label: "Status"
        },

        {
            key: "description",
            label: "Description"
        },

        {
            key: "serial",
            label: "Serial"
        }

    ];


    let html = `

        <table>

            <thead>

                <tr>

    `;


    columns.forEach(
        column => {

            let arrow = "";


            if (
                sortColumn === column.key
            ) {

                arrow =
                    sortDirection === "asc"
                        ? " ▲"
                        : " ▼";

            }


            html += `

                <th
                    data-column="${escapeAttribute(
                        column.key
                    )}"
                >

                    ${escapeHTML(
                        column.label
                    )}

                    ${arrow}

                </th>

            `;

        }
    );


    html += `

                </tr>

            </thead>

            <tbody>

    `;


    filtered.forEach(
        node => {

            const nodeIndex =
                nodes.indexOf(
                    node
                );


            html += `

                <tr
                    data-node-index="${nodeIndex}"
                >

                    <!-- NAME -->

                    <td class="node-name">

                        ${escapeHTML(
                            getColumn(
                                node,
                                "name"
                            )
                        )}

                    </td>


                    <!-- INTERNAL IP -->

                    <td class="ip-address">

                        ${createIPLink(
                            getColumn(
                                node,
                                "internal-ip"
                            )
                        )}

                    </td>


                    <!-- IPMI IP -->

                    <td class="ip-address">

                        ${createIPLink(
                            getColumn(
                                node,
                                "ipmi-ip"
                            )
                        )}

                    </td>


                    <!-- MANAGEMENT IP -->

                    <td class="ip-address">

                        ${createIPLink(
                            getColumn(
                                node,
                                "mgmt-ip"
                            )
                        )}

                    </td>


                    <!-- TYPE -->

                    <td>

                        <span class="type-badge">

                            ${escapeHTML(
                                getColumn(
                                    node,
                                    "type"
                                ) ||
                                "Other"
                            )}

                        </span>

                    </td>


                    <!-- RACK -->

                    <td>

                        ${escapeHTML(
                            getColumn(
                                node,
                                "rack"
                            )
                        )}

                    </td>


                    <!-- LOCATION -->

                    <td>

                        ${escapeHTML(
                            getColumn(
                                node,
                                "location"
                            )
                        )}

                    </td>


                    <!-- STATUS -->

                    <td>

                        ${createStatusBadge(
                            getColumn(
                                node,
                                "status"
                            )
                        )}

                    </td>


                    <!-- DESCRIPTION -->

                    <td>

                        ${escapeHTML(
                            getColumn(
                                node,
                                "description"
                            )
                        )}

                    </td>


                    <!-- SERIAL -->

                    <td class="serial">

                        ${escapeHTML(
                            getColumn(
                                node,
                                "serial"
                            )
                        )}

                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    tableContainer.innerHTML =
        html;


    /*
     * ----------------------------------------------------------
     * Column sorting
     * ----------------------------------------------------------
     */

    tableContainer
        .querySelectorAll(
            "th"
        )
        .forEach(
            th => {

                th.addEventListener(
                    "click",
                    () => {

                        const column =
                            th.dataset.column;


                        if (
                            sortColumn === column
                        ) {

                            sortDirection =
                                sortDirection === "asc"
                                    ? "desc"
                                    : "asc";

                        } else {

                            sortColumn =
                                column;

                            sortDirection =
                                "asc";

                        }


                        renderTable();

                    }
                );

            }
        );


    /*
     * ----------------------------------------------------------
     * Row click
     * ----------------------------------------------------------
     *
     * Clicking an IP link is excluded.
     *
     * Therefore:
     *
     *     click IP  -> opens IP in new browser tab
     *
     *     click row -> opens node details
     *
     * ----------------------------------------------------------
     */

    tableContainer
        .querySelectorAll(
            "tbody tr"
        )
        .forEach(
            row => {

                row.addEventListener(
                    "click",
                    event => {

                        if (
                            event.target.closest(
                                "a"
                            )
                        ) {

                            return;

                        }


                        const index =
                            Number(
                                row.dataset.nodeIndex
                            );


                        showNodeDetails(
                            nodes[index]
                        );

                    }
                );

            }
        );

}


/* ============================================================
   IP LINK
   ============================================================ */

function createIPLink(
    ip
) {

    ip =
        String(
            ip || ""
        ).trim();


    /*
     * Empty IP.
     */

    if (!ip) {

        return `
            <span class="no-ip">
                —
            </span>
        `;

    }


    /*
     * Every IP is an independent hyperlink.
     *
     * HTTP is used by default.
     *
     * target="_blank" means a new browser tab.
     */

    return `

        <a
            href="http://${escapeAttribute(ip)}"
            target="_blank"
            rel="noopener noreferrer"
            class="ip-link"
            title="Open http://${escapeAttribute(ip)} in a new browser tab"
        >
            ${escapeHTML(ip)}
        </a>

    `;

}


/* ============================================================
   STATUS BADGE
   ============================================================ */

function createStatusBadge(
    value
) {

    const status =
        String(
            value || ""
        ).trim();


    const normalized =
        status.toLowerCase();


    let cssClass =
        "status-unknown";


    if (
        normalized === "online" ||
        normalized === "up" ||
        normalized === "ok" ||
        normalized === "healthy"
    ) {

        cssClass =
            "status-online";

    }


    else if (
        normalized === "warning" ||
        normalized === "warn" ||
        normalized === "degraded"
    ) {

        cssClass =
            "status-warning";

    }


    else if (
        normalized === "offline" ||
        normalized === "down" ||
        normalized === "failed" ||
        normalized === "failure"
    ) {

        cssClass =
            "status-offline";

    }


    return `

        <span
            class="status-badge ${cssClass}"
        >

            <span
                class="status-dot"
            ></span>

            ${escapeHTML(
                status || "Unknown"
            )}

        </span>

    `;

}


/* ============================================================
   NODE DETAILS
   ============================================================ */

function showNodeDetails(
    node
) {

    const name =
        getColumn(
            node,
            "name"
        ) ||
        "Node Details";


    modalTitle.textContent =
        name;


    detailGrid.innerHTML =
        "";


    /*
     * Display the fields in the same
     * logical order as the table.
     */

    const columns = [

        "name",
        "internal-ip",
        "ipmi-ip",
        "mgmt-ip",
        "type",
        "rack",
        "location",
        "status",
        "description",
        "serial"

    ];


    columns.forEach(
        key => {

            const value =
                getColumn(
                    node,
                    key
                );


            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "detail-label";


            label.textContent =
                getPrettyLabel(
                    key
                );


            const detail =
                document.createElement(
                    "div"
                );


            detail.className =
                "detail-value";


            /*
             * IP address
             */

            if (
                key === "internal-ip" ||
                key === "ipmi-ip" ||
                key === "mgmt-ip"
            ) {

                if (value) {

                    const link =
                        document.createElement(
                            "a"
                        );


                    link.href =
                        "http://" + value;


                    link.target =
                        "_blank";


                    link.rel =
                        "noopener noreferrer";


                    link.className =
                        "ip-link";


                    link.textContent =
                        value;


                    detail.appendChild(
                        link
                    );

                } else {

                    detail.textContent =
                        "—";

                }

            }


            /*
             * Status
             */

            else if (
                key === "status"
            ) {

                detail.innerHTML =
                    createStatusBadge(
                        value
                    );

            }


            /*
             * Normal field
             */

            else {

                detail.textContent =
                    value || "—";

            }


            detailGrid.appendChild(
                label
            );


            detailGrid.appendChild(
                detail
            );

        }
    );


    modalOverlay.classList.add(
        "show"
    );

}


/* ============================================================
   PRETTY LABEL
   ============================================================ */

function getPrettyLabel(
    key
) {

    switch (key) {

        case "name":
            return "Name";

        case "internal-ip":
            return "Internal IP";

        case "ipmi-ip":
            return "IPMI IP";

        case "mgmt-ip":
            return "Mgmt IP";

        case "type":
            return "Type";

        case "rack":
            return "Rack";

        case "location":
            return "Location";

        case "status":
            return "Status";

        case "description":
            return "Description";

        case "serial":
            return "Serial";

        default:
            return key;

    }

}


/* ============================================================
   CLOSE MODAL
   ============================================================ */

closeModal.addEventListener(
    "click",
    closeDetails
);


modalOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            modalOverlay
        ) {

            closeDetails();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeDetails();

        }

    }
);


function closeDetails() {

    modalOverlay.classList.remove(
        "show"
    );

}


/* ============================================================
   STATUS MESSAGE
   ============================================================ */

function setStatus(
    message,
    type = ""
) {

    statusElement.textContent =
        message;


    statusElement.className =
        "status " + type;

}


/* ============================================================
   HTML ESCAPING
   ============================================================ */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


function escapeAttribute(
    value
) {

    return escapeHTML(
        value
    );

}

</script>
